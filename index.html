<script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    const questionBox = document.getElementById("questionBox");
    const success = document.getElementById("success");

    const messageContainer =
        document.getElementById("messageContainer");


    /*
     * Cute messages
     */

    const messages = [

        "Are you sure you want to avoid me? 🥺",

        "Sukoon nahi chahiye? 😭",

        "11 September ko ek drink bhi mere saath nahi? 🍷🥺",

        "Itna bhaav? 😤❤️",

        "Mere saath thoda sa time spend kar lo na... 🥺",

        "Okay Shruti... think again? 👉👈❤️",

        "Last chance... Daru Date? 🍷❤️"

    ];


    /*
     * NO button texts
     */

    const buttonTexts = [

        "Really? 🥺",

        "Still no? 😭",

        "Think again ❤️",

        "Maybe? 🥺",

        "Come on 😭",

        "Please? 👉👈",

        "Last chance ❤️"

    ];


    let noClickCount = 0;


    /*
     * NO button
     */

    noBtn.addEventListener("click", function () {

        /*
         * Show cute message
         */

        const message =
            messages[noClickCount % messages.length];

        showMessage(message);


        /*
         * Change NO button text
         */

        noBtn.textContent =
            buttonTexts[
                Math.min(
                    noClickCount,
                    buttonTexts.length - 1
                )
            ];


        /*
         * Make YES button slightly bigger
         */

        const currentScale =
            1 + Math.min(noClickCount * 0.04, 0.25);

        yesBtn.style.transform =
            `scale(${currentScale})`;


        /*
         * MOVE THE NO BUTTON
         */

        moveNoButton();


        noClickCount++;

    });


    /*
     * Move NO button to a random position
     */

    function moveNoButton() {

        /*
         * Change button from normal layout
         * to fixed positioning
         */

        noBtn.style.position = "fixed";

        /*
         * Get button dimensions
         */

        const buttonWidth = noBtn.offsetWidth;
        const buttonHeight = noBtn.offsetHeight;


        /*
         * Keep the button inside the screen
         */

        const maxX =
            window.innerWidth - buttonWidth - 20;

        const maxY =
            window.innerHeight - buttonHeight - 20;


        /*
         * Random position
         */

        const randomX =
            Math.max(
                20,
                Math.random() * maxX
            );

        const randomY =
            Math.max(
                20,
                Math.random() * maxY
            );


        /*
         * Smooth movement
         */

        noBtn.style.transition =
            "left 0.35s ease, top 0.35s ease, transform 0.25s ease";

        noBtn.style.left =
            randomX + "px";

        noBtn.style.top =
            randomY + "px";


        /*
         * Little bounce effect
         */

        noBtn.style.transform =
            "scale(1.08)";

        setTimeout(() => {

            noBtn.style.transform =
                "scale(1)";

        }, 250);

    }


    /*
     * Show cute message
     */

    function showMessage(message) {

        messageContainer.innerHTML = "";

        const messageElement =
            document.createElement("div");

        messageElement.className =
            "cute-message";

        messageElement.textContent =
            message;

        messageContainer.appendChild(
            messageElement
        );

    }


    /*
     * YES button
     */

    yesBtn.addEventListener("click", function () {

        questionBox.classList.add("hidden");

        success.classList.remove("hidden");

        createConfetti();

    });


    /*
     * Confetti
     */

    function createConfetti() {

        const emojis = [

            "❤️",
            "💕",
            "💖",
            "🥂",
            "🍷",
            "🎉",
            "✨",
            "💗",
            "🥳"

        ];


        for (let i = 0; i < 100; i++) {

            const confetti =
                document.createElement("div");

            confetti.className =
                "confetti";

            confetti.textContent =
                emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                ];


            confetti.style.left =
                Math.random() * 100 + "vw";


            confetti.style.animationDuration =
                (2 + Math.random() * 3) + "s";


            confetti.style.animationDelay =
                Math.random() * 1.5 + "s";


            document.body.appendChild(
                confetti
            );


            setTimeout(() => {

                confetti.remove();

            }, 5000);

        }

    }

</script>
